name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          find . -maxdepth 1 -type f \
            \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.svg' -o -name 'CNAME' \
               -o -name '*.html.md' -o -name 'llms.txt' -o -name 'robots.txt' -o -name 'sitemap.xml' \) \
            -exec cp {} _site/ \;
          cp -R assets _site/assets
          # Generated case study pages (committed output of tools/build.js)
          [ -d portfolio ] && cp -R portfolio _site/portfolio || true
          touch _site/.nojekyll

      - name: Include Antigravity Android App Links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/.well-known
          curl --fail --silent --show-error --retry 3 --connect-timeout 15 --max-time 60 \
            https://antigravity-legal.antigravity-legal.workers.dev/.well-known/assetlinks.json \
            --output _site/.well-known/assetlinks.json
          # Exact reviewed copy of TPAppsorg/antigravity_mobile/AntigravityAndroid/play/assetlinks.json.
          # Fail before deployment if the source is unavailable or differs from the approved content.
          echo "c544206400634e97ef3c2176f0b846faa06670a09d3a6791a3084b064910b78f  _site/.well-known/assetlinks.json" | sha256sum --check --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
